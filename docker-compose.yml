# Dev gateway + broker for building and testing the modules in this repo.
#
#   docker compose up -d
#   gateway: http://localhost:8088  (admin / password)
#   broker:  localhost:1883
#
# Install a module build with scripts/install-module.sh

services:
  gateway:
    image: inductiveautomation/ignition:8.3.9
    ports:
      - "8088:8088"
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: password
      IGNITION_EDITION: standard
      # third-party modules in user-lib/modules are picked up on first boot of a fresh data volume, provided
      # their license and certificate are accepted here
      ACCEPT_MODULE_LICENSES: "com.joyautomation.mantle"
      ACCEPT_MODULE_CERTS: "com.joyautomation.mantle"
      TZ: America/Chicago
    command: >
      -n joy-dev
      --
      -Dignition.allowunsignedmodules=true
    volumes:
      - gateway-data:/usr/local/bin/ignition/data
    # So a Sparkplug TCK harness running on the host is reachable as a broker from inside the container.
    # scripts/tck-conformance.sh uses this; nothing else does.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - broker

  # Three listeners: 1883 anonymous, 1884 username/password, 8883 TLS + username/password. See
  # dev/mosquitto.conf. Run scripts/gen-dev-certs.sh first — dev-up.sh does.
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "1884:1884"
      - "8883:8883"
      - "8884:8884"
      - "8083:8083"
    volumes:
      - ./dev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./dev/certs:/mosquitto/certs:ro

  # A second broker implementation, because "it works against Mosquitto" is a statement about Mosquitto.
  # EMQX is the one most likely to be found in a plant after Mosquitto, and it differs in the places
  # Sparkplug leans on hardest: retained messages, will delivery and session takeover.
  #
  # Anonymous on 1883 to keep the comparison to one variable — the broker.
  emqx:
    image: emqx/emqx:5.10.5
    ports:
      - "1886:1883"
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_NODE__COOKIE: mantle-dev
      # EMQX defaults to refusing anonymous connections in 5.x; both of these are needed.
      EMQX_AUTHENTICATION: "[]"
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE_AUTHN: "false"

  # A third implementation. HiveMQ is the broker the Sparkplug specification's own TCK is built on, so it is
  # the one a Sparkplug host has least excuse for not working against.
  hivemq:
    image: hivemq/hivemq-ce:latest
    ports:
      - "1887:1883"

volumes:
  gateway-data:
