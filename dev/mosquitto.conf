# Three listeners, so a test can vary one thing at a time. Certificates and the password file come from
# scripts/gen-dev-certs.sh; the CA is private, which is the point — a broker signed by a CA the JVM has never
# heard of is what a broker in a plant actually looks like.

# Without this, allow_anonymous and password_file are GLOBAL in mosquitto 2 and the last one written wins —
# which silently turns the anonymous listener below into an authenticated one and breaks everything that used
# to work. With it, each setting applies to the listener declared above it.
per_listener_settings true

# 1883 — anonymous, no TLS. The original dev listener; the demo and most of the suite use it.
listener 1883
allow_anonymous true

# 1884 — username and password, no TLS. Isolates authentication from TLS.
listener 1884
allow_anonymous false
password_file /mosquitto/certs/passwd

# 8883 — TLS, and a username and password. What a real deployment looks like.
listener 8883
allow_anonymous false
password_file /mosquitto/certs/passwd
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
# No client certificate asked for here, so this listener isolates server-side TLS from mutual TLS; 8884
# below is the mutual one.
require_certificate false

# 8884 — TLS, and the client must present a certificate signed by our CA. Mutual TLS, as a plant that issues
# device certificates would run it. No password: the certificate is the identity.
listener 8884
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate true

# 8083 — MQTT over WebSockets, anonymous. Mantle parses ws:// and wss:// and sets HiveMQ's WebSocket config
# from the URL path, and none of that had ever run.
listener 8083
protocol websockets
allow_anonymous true

persistence false
log_dest stdout
