# Cutting a Mantle release.
#
#   git tag mantle/v1.3.0 && git push origin mantle/v1.3.0
#
# The tag is the only input: the version comes out of it, so the .modl, the release and the tag can never
# disagree. Everything the Showcase and the gateway need is verified before anything is published, and the
# release is created as a draft — the last step of publishing a module is a person deciding to.
#
# Signing uses three repository secrets. Without them the job fails rather than quietly shipping an unsigned
# module, because an unsigned .modl only loads on a gateway started with -Dignition.allowunsignedmodules=true
# and nobody should discover that from a download:
#
#   MODULE_SIGNING_KEYSTORE_B64   base64 of the PKCS#12 keystore
#   MODULE_SIGNING_KEYSTORE_PASS  its password
#   MODULE_SIGNING_ALIAS          the key alias inside it
#
# docs/releasing.md explains how to make a self-signed one, which is enough to be listed.
name: Release

on:
  push:
    tags: ['mantle/v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 1.3.0 (middle digit must be the platform's minor)
        required: true

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: Build, verify and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {path: ignition}
      - uses: actions/checkout@v7
        with: {repository: joyautomation/nautilus, ref: main, path: nautilus}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v7
        with: {go-version: '1.24', cache-dependency-path: nautilus/go.sum}

      # The tag is the source of truth. mantle/v1.3.0 -> 1.3.0, and the shape is checked here rather than
      # after a twenty minute build.
      - name: Version from the tag
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#mantle/v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.3\.[0-9]+$'; then
            echo "::error::'$version' is not a valid Mantle version. The middle digit must match the" \
                 "platform's minor version (8.3 -> x.3.y) or the gateway faults the module."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Mantle $version" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Unit tests and distribution checks
        run: ./gradlew clean build -PmantleVersion=${{ steps.version.outputs.version }}
        working-directory: ignition/mantle

      # The same suite CI runs: a real Nautilus edge, a real broker with TLS and mutual TLS, a real gateway.
      # A release that has not been through this is not a release.
      - name: Bring up the stack
        run: scripts/dev-up.sh --fresh
        working-directory: ignition
      - name: Integration tests
        run: go test -count=1 -timeout 25m ./mantle/...
        working-directory: ignition/integration
        env:
          NAUTILUS_SRC: ${{ github.workspace }}/nautilus
      - name: Tear down
        if: always()
        run: docker compose down -v
        working-directory: ignition

      - name: Sign the module
        env:
          KEYSTORE_B64: ${{ secrets.MODULE_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.MODULE_SIGNING_KEYSTORE_PASS }}
          ALIAS: ${{ secrets.MODULE_SIGNING_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::No signing keystore. Set MODULE_SIGNING_KEYSTORE_B64, MODULE_SIGNING_KEYSTORE_PASS" \
                 "and MODULE_SIGNING_ALIAS; see docs/releasing.md. Refusing to publish an unsigned module."
            exit 1
          fi
          # Outside the workspace, so it cannot be picked up by a later step or an upload glob.
          keystore="$RUNNER_TEMP/signing.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          ./gradlew clean signModule \
            -PmantleVersion=${{ steps.version.outputs.version }} \
            -Pignition.signing.keystoreFile="$keystore" \
            -Pignition.signing.keystorePassword="$KEYSTORE_PASS" \
            -Pignition.signing.certAlias="$ALIAS" \
            -Pignition.signing.keyPassword="$KEYSTORE_PASS"
          rm -f "$keystore"
        working-directory: ignition/mantle

      # A signed build is a different artifact from the one the tests ran against, so it gets checked again.
      - name: Verify the signed module
        run: |
          ./gradlew checkModuleArtifact -PmantleVersion=${{ steps.version.outputs.version }}
          modl=$(ls build/*.modl | head -1)
          if [ "${modl}" != "${modl%unsigned.modl}" ]; then
            echo "::error::signModule produced ${modl} — the module is not signed"; exit 1
          fi
          echo "artifact: $(basename "$modl") ($(du -h "$modl" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ignition/mantle

      - name: Checksums
        run: |
          cd ignition/mantle/build
          sha256sum *.modl > SHA256SUMS
          cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Mantle-${{ steps.version.outputs.version }}
          path: |
            ignition/mantle/build/*.modl
            ignition/mantle/build/SHA256SUMS
            ignition/mantle/build/reports/dependency-licenses.txt
          if-no-files-found: error

      # A draft: the Showcase listing points at a download, and a half-finished release note is a worse first
      # impression than a late one. Publishing is a person pressing a button.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd ignition
          notes=$(mktemp)
          {
            echo "Mantle $VERSION — a Sparkplug B host application for Ignition 8.3."
            echo
            echo "Free and open source, Apache-2.0. Commercial support from Joy Automation."
            echo
            echo "## Install"
            echo "Gateway → Config → Modules → Install, and pick the \`.modl\`. Then"
            echo "**Connections → Sparkplug → Connections** to point it at a broker."
            echo
            echo "## Verified in this build"
            echo "- Unit tests, and the integration suite against a real Sparkplug edge node and a live 8.3 gateway"
            echo "- TLS, authenticated and mutual-TLS brokers"
            echo "- No copyleft dependencies; every bundled library named in NOTICE"
            echo
            echo "## Checksums"
            echo '```'
            cat mantle/build/SHA256SUMS
            echo '```'
          } > "$notes"
          gh release create "mantle/v$VERSION" \
            --draft \
            --title "Mantle $VERSION" \
            --notes-file "$notes" \
            mantle/build/*.modl \
            mantle/build/SHA256SUMS
