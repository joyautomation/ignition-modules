name: CI

on:
  push: {branches: [main]}
  pull_request:
  # Nautilus moves on its own schedule, and the integration job builds its edge node from source. A nightly run
  # is what notices when a change over there breaks the pair.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      nautilus-ref:
        description: Nautilus branch, tag or SHA to test against
        default: main

env:
  GOTOOLCHAIN: local
  NAUTILUS_REF: ${{ inputs.nautilus-ref || 'main' }}

# a newer push to the same branch makes the older run pointless, and each integration run holds a gateway
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One repo, several modules: a change to one shouldn't boot a gateway for another. Shared paths (the dev stack,
  # the scripts, the test harness, this file) count as a change to every module. Scheduled and manual runs test
  # everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      mantle: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.mantle }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'docker-compose.yml'
              - 'scripts/**'
              - 'dev/config/core-historian/**'
              - 'integration/go.mod'
              - 'integration/harness/**'
              - 'integration/gateway-project/**'
              - '.github/workflows/**'
            mantle:
              - *shared
              - 'mantle/**'
              - 'integration/mantle/**'
              - 'dev/config/mantle/**'

  mantle:
    name: Mantle — unit tests, build .modl
    needs: changes
    if: needs.changes.outputs.mantle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
        working-directory: mantle
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantle-unit-test-report
          path: mantle/gateway/build/reports/tests/test
          if-no-files-found: ignore
      # unsigned: loads only on a gateway started with -Dignition.allowunsignedmodules=true
      - uses: actions/upload-artifact@v4
        with:
          name: Mantle-Ignition-unsigned-modl
          path: mantle/build/*.modl
          if-no-files-found: error

  mantle-integration:
    name: Mantle — integration (Nautilus edge × Ignition 8.3)
    needs: changes
    if: needs.changes.outputs.mantle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Side by side, the way they sit on a developer's disk: the harness builds the nautilus CLI from a sibling
      # checkout so the edge node under test is never a stale binary.
      - uses: actions/checkout@v4
        with: {path: ignition}
      - uses: actions/checkout@v4
        with:
          repository: joyautomation/nautilus
          ref: ${{ env.NAUTILUS_REF }}
          path: nautilus
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: nautilus/go.sum

      - name: Which Nautilus
        run: echo "nautilus @ $(git -C nautilus rev-parse --short HEAD) ($NAUTILUS_REF)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Ignition (trial mode, fresh volume), mosquitto, the module, a Core Historian, a broker connection and the
      # tests' WebDev project. The same script a developer runs.
      - name: Bring up the stack
        run: scripts/dev-up.sh --fresh
        working-directory: ignition

      - run: go vet ./...
        working-directory: ignition/integration
      - name: Integration tests
        run: go test -count=1 -v -timeout 20m ./mantle/...
        working-directory: ignition/integration
        env:
          NAUTILUS_SRC: ${{ github.workspace }}/nautilus

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          docker compose logs --no-color gateway > logs/gateway.log 2>&1 || true
          docker compose logs --no-color broker > logs/broker.log 2>&1 || true
          grep -E 'Mantle|M\.Host|M\.Tags|M\.C\.' logs/gateway.log > logs/mantle.log || true
        working-directory: ignition
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs
          path: ignition/logs
      - name: Tear down
        if: always()
        run: docker compose down -v
        working-directory: ignition
